version: '3.8'

services:
  # Laravel Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carcheck_backend
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=carcheck_db
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    depends_on:
      - db
    networks:
      - carcheck-net

  # Nginx Web Server for Laravel
  webserver:
    image: nginx:alpine
    container_name: carcheck-webserver
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - carcheck-net

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: carcheck-db
    restart: always
    environment:
      MYSQL_DATABASE: carcheck_db
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "4306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - carcheck-net

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carcheck_frontend
    restart: always
    ports:
      - "5173:80"
    networks:
      - carcheck-net

volumes:
  dbdata:

networks:
  carcheck-net:
    driver: bridge